<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive, standalone walkthrough of the proposed GenLedge report workflow. All activity and data are simulated."
    />
    <title>Report workflow · GenLedge</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #182230;
        background: #f7f9fb;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        --teal: #078b81;
        --teal-dark: #08776f;
        --ink: #182230;
        --muted: #667085;
        --line: #e8edf1;
        --page: #f7f9fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      button,
      a,
      input,
      textarea,
      select,
      summary {
        -webkit-tap-highlight-color: transparent;
      }
      :focus-visible {
        outline: 3px solid #5cc7bc;
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      button,
      a {
        touch-action: manipulation;
      }
      svg {
        flex-shrink: 0;
        vertical-align: middle;
      }
      .topbar {
        height: 58px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .topbar-inner {
        width: min(100% - 48px, 1200px);
        height: 100%;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .brand {
        position: relative;
        color: #00a594;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -1px;
        text-decoration: none;
      }
      .brand span {
        font-weight: 500;
      }
      .brand sup {
        position: absolute;
        top: -2px;
        right: -10px;
        font-size: 11px;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 12px;
        border-left: 1px solid var(--line);
        padding-left: 24px;
        color: #8a96a5;
        font-size: 12px;
      }
      .breadcrumb strong {
        color: #344054;
        font-weight: 600;
      }
      .offline {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 7px;
        color: #667085;
        font-size: 11px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d59c21;
        display: inline-block;
      }
      main {
        width: min(100% - 48px, 1200px);
        margin: auto;
        padding: 36px 0 48px;
      }
      .page-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      .eyebrow {
        color: var(--teal-dark);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        margin-bottom: 7px;
      }
      h1 {
        font-size: 27px;
        font-weight: 650;
        letter-spacing: -0.7px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
        margin-top: 7px;
      }
      .btn {
        min-height: 38px;
        border: 1px solid #dce3e9;
        border-radius: 7px;
        background: #fff;
        color: #344054;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 14px;
        font-size: 12px;
        line-height: 1.5;
        font-weight: 600;
        text-decoration: none;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn:hover:not(:disabled) {
        background: #f4f8f7;
        border-color: #9ad6cf;
      }
      .btn.primary {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--teal-dark);
      }
      .btn.danger {
        color: #b42318;
        border-color: #f3c7c2;
      }
      .btn.text {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
        padding-left: 0;
      }
      .btn.small {
        min-height: 32px;
        padding: 5px 10px;
        font-size: 11px;
      }
      .walkthrough-note {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 13px 18px;
        border: 1px solid #dcebe7;
        background: #f0f8f6;
        border-radius: 9px;
        margin-bottom: 22px;
        color: #46665f;
        font-size: 12px;
        line-height: 1.6;
      }
      .walkthrough-note strong {
        color: #23584f;
      }
      .walkthrough-note span {
        flex-shrink: 0;
        color: #56766f;
        font-size: 11px;
      }
      .workspace {
        display: grid;
        grid-template-columns: 225px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }
      .sidebar {
        position: sticky;
        top: 22px;
      }
      .steps {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 17px 10px 10px;
      }
      .rail-title {
        padding: 0 12px 12px;
        color: #8590a0;
        font-size: 10px;
        letter-spacing: 0.09em;
        font-weight: 700;
        text-transform: uppercase;
      }
      .step {
        width: 100%;
        border: 0;
        background: transparent;
        padding: 12px 10px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
        color: #7c8898;
      }
      .step + .step {
        margin-top: 3px;
      }
      .step.active {
        background: #edf8f5;
        color: var(--teal-dark);
      }
      .step.done {
        color: #344054;
      }
      .step:disabled {
        opacity: 0.6;
      }
      .step-number {
        width: 27px;
        height: 27px;
        border: 1px solid #e1e6ea;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 650;
        flex-shrink: 0;
        background: #fff;
      }
      .step.active .step-number {
        color: #fff;
        background: var(--teal);
        border-color: var(--teal);
      }
      .step.done .step-number {
        color: var(--teal);
        background: #f0f9f6;
        border-color: #cce8de;
      }
      .step-name {
        display: block;
        font-size: 12px;
        font-weight: 650;
      }
      .step-role {
        display: block;
        margin-top: 3px;
        color: #8590a0;
        font-size: 10px;
      }
      .sidebar-note {
        margin: 17px 12px 0;
        color: #7a8796;
        font-size: 11px;
        line-height: 1.7;
      }
      .sidebar-note strong {
        color: #526270;
        display: block;
        margin-bottom: 4px;
        font-weight: 600;
      }
      .stage {
        min-width: 0;
      }
      .stage-shell {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .stage-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 26px;
        border-bottom: 1px solid var(--line);
      }
      .stage-header h2 {
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.3px;
      }
      .stage-header p {
        color: #7a8796;
        font-size: 11px;
        margin-top: 6px;
        line-height: 1.6;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: 999px;
        background: #f2f4f7;
        color: #667085;
        font-size: 10px;
        line-height: 1.4;
        font-weight: 650;
        white-space: nowrap;
      }
      .badge.teal {
        background: #edf8f5;
        color: #087f61;
      }
      .badge.amber {
        background: #fff7e5;
        color: #946200;
      }
      .badge.red {
        background: #fef0ee;
        color: #b42318;
      }
      .badge.blue {
        background: #eef4fc;
        color: #3f68a5;
      }
      .stage-body {
        padding: 26px;
        min-height: 400px;
      }
      .stage-footer {
        border-top: 1px solid var(--line);
        padding: 16px 26px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .footer-caption {
        color: #8590a0;
        font-size: 11px;
      }
      .explanation {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        padding: 17px 4px;
        color: #667085;
        font-size: 12px;
        line-height: 1.75;
      }
      .explanation svg {
        color: var(--teal);
        margin-top: 2px;
      }
      .explanation strong {
        color: #344054;
        font-weight: 600;
      }
      .assistant-label {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #087f76;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .assistant-label .dot {
        background: #10a99a;
      }
      .conversation {
        background: var(--page);
        border: 1px solid var(--line);
        padding: 23px;
        border-radius: 9px;
      }
      .conversation p {
        font-size: 13px;
        line-height: 1.8;
        color: #475467;
      }
      .request-bubble {
        background: #eef8f6;
        border: 1px solid #d9ebe8;
        border-radius: 12px 12px 3px 12px;
        padding: 16px;
        margin: 22px 0 20px 28px;
      }
      .request-bubble label {
        display: block;
        font-size: 10px;
        color: #588078;
        margin-bottom: 6px;
        font-weight: 650;
      }
      textarea,
      input,
      select {
        width: 100%;
        border: 1px solid #d9e1e7;
        border-radius: 7px;
        background: #fff;
        padding: 10px 12px;
        color: #344054;
        font-size: 12px;
        line-height: 1.6;
      }
      textarea {
        resize: vertical;
        min-height: 82px;
      }
      .request-bubble textarea {
        border: 0;
        background: transparent;
        padding: 0;
        min-height: 76px;
        color: #203d3a;
        font-size: 14px;
      }
      .request-bubble textarea:focus-visible {
        outline-offset: 6px;
      }
      .caption {
        font-size: 11px;
        color: #8590a0;
        line-height: 1.7;
      }
      .label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #475467;
        margin-bottom: 7px;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .section-title h3 {
        font-size: 13px;
        font-weight: 650;
      }
      .section-title span {
        color: #8590a0;
        font-size: 10px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 22px;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 16px;
        background: #fff;
      }
      .stat span {
        display: block;
        color: #7a8796;
        font-size: 10px;
        margin-bottom: 7px;
      }
      .stat strong {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.6px;
      }
      .stat strong.teal {
        color: var(--teal-dark);
      }
      .catalog {
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      .catalog details + details {
        border-top: 1px solid var(--line);
      }
      .catalog summary {
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        list-style: none;
      }
      .catalog summary::-webkit-details-marker {
        display: none;
      }
      .catalog summary .chevron {
        margin-left: auto;
        color: #98a2b3;
      }
      .catalog details[open] .chevron {
        transform: rotate(90deg);
      }
      .catalog .table-wrap {
        padding: 0 16px 13px;
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 11px;
      }
      th {
        text-align: left;
        padding: 10px 12px;
        background: #f8fafb;
        color: #8590a0;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      td {
        padding: 11px 12px;
        border-bottom: 1px solid #f0f3f5;
        color: #475467;
        line-height: 1.6;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
      }
      .notice {
        display: flex;
        gap: 9px;
        border: 1px solid #d9ebe5;
        background: #f1faf6;
        padding: 13px 15px;
        border-radius: 8px;
        color: #427163;
        font-size: 11px;
        line-height: 1.7;
        margin-top: 18px;
      }
      .notice svg {
        margin-top: 2px;
      }
      .notice.amber {
        border-color: #f1dfb7;
        background: #fffbf1;
        color: #92681d;
      }
      .notice.red {
        border-color: #f1d3cd;
        background: #fff7f5;
        color: #a34c3f;
      }
      .tabs {
        display: flex;
        gap: 22px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 20px;
        overflow-x: auto;
      }
      .tab {
        border: 0;
        background: transparent;
        color: #7a8796;
        padding: 0 1px 12px;
        font-size: 12px;
        font-weight: 550;
        white-space: nowrap;
      }
      .tab.active {
        border-bottom: 2px solid var(--teal);
        color: var(--teal-dark);
        font-weight: 650;
      }
      .source-card {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 17px;
      }
      .source-card header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 12px;
        font-weight: 650;
      }
      .source-card p {
        font-size: 12px;
        line-height: 1.8;
        color: #667085;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 13px 0;
      }
      .chip {
        border: 1px solid #dce9e5;
        border-radius: 5px;
        padding: 4px 8px;
        color: #3d7065;
        background: #f4faf8;
        font-size: 10px;
      }
      .transform-list {
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .transform-list li {
        display: flex;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .transform-list li:last-child {
        border-bottom: 0;
      }
      .transform-number {
        width: 24px;
        height: 24px;
        background: #f0f6f4;
        color: #4f8173;
        border-radius: 6px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 10px;
      }
      .transform-list strong {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .transform-list p {
        font-size: 11px;
        color: #7a8796;
        line-height: 1.7;
      }
      pre {
        padding: 18px;
        border: 1px solid #e1e9ec;
        border-radius: 8px;
        background: #f8fafb;
        color: #3c5968;
        line-height: 1.9;
        overflow: auto;
        margin: 0;
        font-size: 11px;
        tab-size: 2;
      }
      .sql-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .mini-layout {
        background: #fbfcfd;
        border: 1px dashed #d8e3df;
        border-radius: 9px;
        padding: 20px;
      }
      .mini-layout h4 {
        font-size: 12px;
        margin-bottom: 18px;
        font-weight: 600;
      }
      .empty-chart {
        height: 120px;
        border-left: 1px solid #dce4e6;
        border-bottom: 1px solid #dce4e6;
        display: grid;
        place-items: center;
        margin: 8px 12px 18px 23px;
        color: #84948e;
        font-size: 11px;
        background: repeating-linear-gradient(
          to top,
          transparent,
          transparent 39px,
          #eef2f3 39px,
          #eef2f3 40px
        );
      }
      .empty-table {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 12px 0;
      }
      .empty-table span {
        height: 7px;
        background: #e9eeef;
        border-radius: 3px;
      }
      .review-layout {
        display: grid;
        grid-template-columns: 176px minmax(0, 1fr);
        gap: 18px;
      }
      .queue {
        border: 1px solid var(--line);
        border-radius: 9px;
        align-self: start;
        overflow: hidden;
      }
      .queue-title {
        padding: 13px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        font-weight: 650;
      }
      .queue-item {
        padding: 14px 12px;
        border-left: 3px solid var(--teal);
        background: #f1f9f6;
      }
      .queue-item strong {
        display: block;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.6;
        margin-bottom: 9px;
      }
      .queue-item p {
        font-size: 10px;
        margin-top: 9px;
        color: #7a8796;
      }
      .review-detail {
        min-width: 0;
      }
      .detail-title {
        font-size: 15px;
        font-weight: 650;
        margin-bottom: 7px;
      }
      .check-list {
        display: grid;
        gap: 10px;
        margin: 19px 0;
      }
      .check-list span {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #526b61;
        font-size: 11px;
        line-height: 1.6;
      }
      .check-list svg {
        color: var(--teal);
      }
      .definition-summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin: 18px 0;
      }
      .definition-summary div {
        padding: 12px;
      }
      .definition-summary div:nth-child(odd) {
        border-right: 1px solid var(--line);
      }
      .definition-summary div:nth-child(n + 3) {
        border-top: 1px solid var(--line);
      }
      .definition-summary dt {
        color: #8590a0;
        font-size: 10px;
        margin-bottom: 6px;
      }
      .definition-summary dd {
        margin: 0;
        font-size: 11px;
        color: #475467;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .feedback {
        border-top: 1px solid var(--line);
        padding-top: 18px;
        margin-top: 20px;
      }
      .feedback select {
        margin-bottom: 10px;
      }
      .feedback textarea {
        margin-bottom: 10px;
      }
      .history {
        margin-top: 20px;
      }
      .history summary {
        color: #667085;
        font-size: 11px;
        cursor: pointer;
        padding-bottom: 10px;
      }
      .history-row {
        border-left: 2px solid #e2eae7;
        padding: 4px 0 14px 13px;
        margin-left: 4px;
      }
      .history-row strong {
        font-size: 11px;
        font-weight: 600;
      }
      .history-row p {
        color: #8590a0;
        font-size: 10px;
        line-height: 1.7;
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .editor {
        border: 1px solid #cde5dd;
        background: #f8fcfa;
        padding: 16px;
        border-radius: 8px;
        margin-top: 16px;
      }
      .editor .field + .field {
        margin-top: 13px;
      }
      .editor .actions {
        margin-top: 16px;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #475467;
        font-size: 12px;
      }
      input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--teal);
      }
      .saved-heading {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 23px;
      }
      .success-icon {
        width: 43px;
        height: 43px;
        display: grid;
        place-items: center;
        border: 1px solid #cce8dc;
        border-radius: 50%;
        background: #edf8f3;
        color: var(--teal);
      }
      .saved-heading h3 {
        font-size: 16px;
        font-weight: 600;
      }
      .saved-heading p {
        color: #7a8796;
        font-size: 11px;
        margin-top: 5px;
      }
      .recipe {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid var(--line);

  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a
          class="brand"
          href="#"
          aria-label="GenLedge walkthrough home"
          data-action="home"
          >gen<span>ledge</span><sup aria-hidden="true">↗</sup></a
        >
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <span class="workspace-label">Workspace &nbsp; ›</span
          ><strong>Report workflow</strong>
        </nav>
        <span class="offline"
          ><i class="dot" aria-hidden="true"></i> Prototype · simulated
          data</span
        >
      </div>
    </header>
    <main>
      <div class="page-heading">
        <div>
          <p class="eyebrow">GenLedge · walkthrough</p>
          <h1>Report workflow</h1>
        </div>
        <button
          class="btn"
          data-action="reset"
          aria-label="Restart walkthrough"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <path d="M3 10a9 9 0 1 1 2 8M3 4v6h6" /></svg
          ><span>Restart</span>
        </button>
      </div>
      <div class="workspace">
        <aside class="sidebar">
          <nav
            class="steps"
            id="steps"
            aria-label="Report workflow steps"
          ></nav>
        </aside>
        <div class="stage"><div id="screen"></div></div>
      </div>
      <div
        id="announcement"
        class="sr-only"
        role="status"
        aria-live="polite"
      ></div>
      <noscript
        ><p>
          This interactive walkthrough needs JavaScript enabled in your browser.
        </p></noscript
      >
    </main>
    <script>
      "use strict";
      const defaultRequest =
        "I’d like a monthly report showing how cash is moving through the business.";
      const defaultReply =
        "Q3 2026 in USD. Net cash flow by month, with a chart and a monthly breakdown.";
      const periodOptions = {
        q3: ["Q3 2026 · July–September", "2026-07-01", "2026-10-01"],
        "jul-aug": ["July–August 2026", "2026-07-01", "2026-09-01"],
        sep: ["September 2026", "2026-09-01", "2026-10-01"],
      };
      const steps = [
        "Request a report",
        "Clarify the need",
        "Await review",
        "Review & revise",
        "Report ready",
        "View results",
      ];
      const paths = {
        arrow: '<path d="M4 12h16m-6-6 6 6-6 6"/>',
        back: '<path d="M20 12H4m6-6-6 6 6 6"/>',
        check: '<path d="m5 12 4 4L19 6"/>',
        file: '<path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8m-8 4h6"/>',
        database:
          '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',
        chart: '<path d="M4 3v17h17M8 16v-5m5 5V7m5 9V4"/>',
        refresh: '<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>',
        user: '<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
        engineer: '<path d="m8 5-6 7 6 7m8-14 6 7-6 7m-3-15-2 18"/>',
      };
      const icon = (name, size = 15) =>
        `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.file}</svg>`;
      const escape = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[ch],
        );
      const clone = (value) => JSON.parse(JSON.stringify(value));
      const $ = (selector) => document.querySelector(selector);
      const badge = (text, color = "") =>
        `<span class="badge ${color}">${escape(text)}</span>`;
      const button = (
        action,
        label,
        style = "",
        symbol = "",
        disabled = false,
      ) =>
        `<button type="button" class="btn ${style}" data-action="${action}" ${disabled ? "disabled" : ""}>${symbol ? icon(symbol) : ""}${escape(label)}</button>`;
      function queryFor(split) {
        const measures = split
          ? "    SUM(CASE WHEN t.amount > 0 THEN t.amount ELSE 0 END) AS inflows,\n    SUM(CASE WHEN t.amount < 0 THEN -t.amount ELSE 0 END) AS outflows,\n    SUM(t.amount) AS net_cash_flow"
          : "    SUM(t.amount) AS net_cash_flow";
        return `SELECT\n    date_trunc('month', t.txn_date) AS month,\n${measures}\nFROM public.transactions AS t\nWHERE t.txn_date >= :start_date\n  AND t.txn_date < :end_date\n  AND t.currency = :currency\nGROUP BY date_trunc('month', t.txn_date)\nORDER BY month;`;
      }
      function makeDefinition(
        request = defaultRequest,
        clarification = defaultReply,
        period = "q3",
        currency = "USD",
        split = false,
      ) {
        const fields = [
          "month",
          ...(split ? ["inflows", "outflows"] : []),
          "net_cash_flow",
        ];
        return {
          schemaVersion: 1,
          title: "Monthly cash flow",
          originalRequest: request,
          clarifications: [clarification],
          sources: [
            {
              table: "public.transactions",
              columns: ["txn_date", "amount", "currency"],
            },
          ],
          transformations: [
            "Filter by reporting period and currency.",
            "Group by calendar month.",
            ...(split
              ? [
                  "Sum positive amounts as inflows and absolute negative amounts as outflows.",
                ]
              : []),
            "Sum signed amounts as net cash flow.",
          ],
          query: { dialect: "postgres", sql: queryFor(split) },
          parameters: {
            start_date: { type: "date", default: periodOptions[period][1] },
            end_date: {
              type: "date",
              default: periodOptions[period][2],
              exclusive: true,
            },
            currency: { type: "string", default: currency },
          },
          outputFields: fields,
          views: [
            {
              type: "bar",
              x: "month",
              series: fields.filter((f) => f !== "month"),
            },
            { type: "table", columns: fields },
          ],
        };
      }
      function buffersFor(d) {
        return {
          title: d.title,
          sources: JSON.stringify(d.sources, null, 2),
          transforms: d.transformations.join("\n"),
          sql: d.query.sql,
          parameters: JSON.stringify(d.parameters, null, 2),
          outputs: JSON.stringify(d.outputFields, null, 2),
          layout: JSON.stringify(d.views, null, 2),
        };
      }
      function initialState() {
        const definition = makeDefinition();
        return {
          step: 0,
          furthest: 0,
          request: defaultRequest,
          clarification: defaultReply,
          confirmedSignature: null,
          definition,
          buffers: buffersFor(definition),
          dirty: false,
          revision: 1,
          status: "draft",
          history: [],
          approved: null,
          approvedRevision: null,
          tab: "report",
          inspector: null,
          lineageViewIndex: 0,
          lineageField: "all",
          lineageRelated: true,
          feedbackText: "",
          flash: "",
          error: "",
          requestPeriod: "q3",
          requestCurrency: "USD",
          period: "q3",
          currency: "USD",
          run: null,
          runCount: 0,
          updates: 0,
          sourceChanged: false,
        };
      }
      let state = initialState();
      function currentEntry() {
        return state.history.find((h) => h.revision === state.revision);
      }
      function syncBuffers() {
        state.buffers = buffersFor(state.definition);
        state.dirty = false;
      }
      function addRevision(definition, origin, change) {
        const previous = state.revision;
        state.definition = clone(definition);
        state.revision++;
        state.status = "pending";
        state.history.push({
          revision: state.revision,
          status: "pending",
          origin,
          change,
          basedOnRevision: previous,
          definition: clone(definition),
        });
        state.approved = null;
        state.approvedRevision = null;
        state.run = null;
        state.furthest = 3;
        syncBuffers();
      }
      function go(step, advance = false) {
        if (advance) state.furthest = Math.max(state.furthest, step);
        if (step > state.furthest) return;
        state.step = step;
        state.error = "";
        state.inspector = null;
        render();
        $("#stage-title").focus({ preventScroll: true });
        if (window.matchMedia("(max-width:720px)").matches)
          $("#screen").scrollIntoView({ block: "start" });
      }
      function sidebarMarkup() {
        const groups = [
          {
            role: "Business user",
            context: "Request",
            cls: "business",
            icon: "user",
            indices: [0, 1, 2],
          },
          {
            role: "Data engineer",
            context: "Review",
            cls: "engineer",
            icon: "engineer",
            indices: [3],
          },
          {
            role: "Business user",
            context: "Report",
            cls: "business",
            icon: "user",
            indices: [4, 5],
          },
        ];
        return groups
          .map(
            (g, index) =>
              `${index ? `<p class="role-switch">${index === 1 ? "Switch to engineer" : "Back to business user"}</p>` : ""}<section class="flow-group ${g.cls}" aria-label="${g.role}: ${g.context}"><h2 class="group-title">${icon(g.icon, 13)}${g.role}<span>${g.context}</span></h2><div class="group-steps">${g.indices.map((i) => `<button class="step ${state.step === i ? "active" : i < state.furthest ? "done" : ""}" data-step="${i}" ${i > state.furthest ? "disabled" : ""} ${state.step === i ? 'aria-current="step"' : ""}><span class="step-number">${i < state.furthest ? icon("check", 12) : i + 1}</span><span class="step-name">${steps[i]}</span></button>`).join("")}</div></section>`,
          )
          .join("");
      }
      function requestScreen() {
        return `<form id="request-form"><div class="conversation"><div class="assistant-label"><i class="dot"></i>GenLedge Assistant</div><p>What would you like to understand about your business?</p><div class="request-bubble"><label for="request-text">You</label><textarea id="request-text" maxlength="800" required>${escape(state.request)}</textarea></div></div>${errorMarkup()}</form>`;
      }
      function clarificationScreen() {
        return `<form id="clarify-form"><div class="conversation"><p class="caption" style="margin-bottom:20px">${escape(state.request)}</p><div class="assistant-label"><i class="dot"></i>GenLedge Assistant</div><p>I can put that together. What period and currency should I use? Would you like money coming in and going out separately, or just the net cash flow?</p><div class="request-bubble chat-reply"><label for="clarification-text">You</label><textarea id="clarification-text" maxlength="1000" required>${escape(state.clarification)}</textarea></div></div>${errorMarkup()}</form>`;
      }
      function errorMarkup() {
        return state.error
          ? `<p class="field-error" role="alert">${escape(state.error)}</p>`
          : "";
      }
      function waitingScreen() {
        const ready = state.status === "approved";
        return `<div class="handoff">${badge(ready ? "Ready" : state.status === "rejected" ? "Being revised" : "Awaiting review", ready ? "teal" : "amber")}<h3>${ready ? "Your report is ready." : state.status === "rejected" ? "Your report is being updated." : "Your request is with a data engineer."}</h3><p>${ready ? "Open it whenever you need it." : "Your report will be available once it’s approved."}</p><div class="request-summary"><p>${escape(state.request)}</p><p class="caption">${escape(state.clarification)}</p></div></div>`;
      }
      function editable(field, label, { code = false, sql = false } = {}) {
        return `<div class="proposal-field"><label class="label" for="field-${field}">${label}</label><textarea id="field-${field}" class="definition-editor ${code ? "code" : ""} ${sql ? "sql" : ""}" data-definition-field="${field}" spellcheck="false" aria-describedby="editor-note">${escape(state.buffers[field])}</textarea></div>`;
      }
      function viewTitle(view) {
        return typeof view.title === "string" && view.title.trim()
          ? view.title
          : view.type === "table"
            ? "Monthly detail"
            : "Cash-flow chart";
      }
      function fieldLabel(field) {
        return (
          {
            month: "Month",
            inflows: "Inflows",
            outflows: "Outflows",
            net_cash_flow: "Net cash flow",
          }[field] || field.replaceAll("_", " ")
        );
      }
      function reportPreview() {
        const d = state.definition;
        const period =
          Object.keys(periodOptions).find(
            (k) =>
              periodOptions[k][1] === d.parameters.start_date.default &&
              periodOptions[k][2] === d.parameters.end_date.default,
          ) || state.requestPeriod;
        const months = {
          q3: ["Jul", "Aug", "Sep"],
          "jul-aug": ["Jul", "Aug"],
          sep: ["Sep"],
        }[period];
        const components = d.views
          .map((view, index) => {
            let body = "";
            if (view.type === "table") {
              body = `<div class="preview-table"><table><thead><tr>${view.columns.map((f) => `<th>${escape(fieldLabel(f))}</th>`).join("")}</tr></thead><tbody>${months.map((month) => `<tr>${view.columns.map((f) => `<td>${f === "month" ? month + " 2026" : "—"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
            } else {
              let marks = "";
              const groups = months.length;
              if (view.type === "line")
                view.series.forEach((field, j) => {
                  const color = ["#a2cbbb", "#becfdc", "#c6d8cc"][j % 3];
                  const points = months.map((m, i) => [
                    70 + i * (440 / groups),
                    [92, 58, 76][i] + j * 13,
                  ]);
                  marks += `<polyline points="${points.map((p) => p.join(",")).join(" ")}" stroke="${color}" stroke-width="2.5" fill="none"/>${points.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="${color}"/>`).join("")}`;
                });
              else
                for (let i = 0; i < groups; i++)
                  for (let j = 0; j < Math.min(view.series.length, 3); j++) {
                    const w = 28;
                    const x = 55 + i * (440 / groups) + j * 32;
                    const height = [67, 98, 82][i] + j * 6;
                    marks += `<rect x="${x}" y="${143 - height}" width="${w}" height="${height}" rx="3" fill="${["#b0d3c4", "#d0e3d9", "#c0d7df"][j]}"/>`;
                  }
              body = `<svg class="preview-chart" viewBox="0 0 560 170" role="img" aria-label="${escape(view.type)} chart layout, without report values"><path d="M30 21H535M30 62H535M30 103H535M30 144H535" stroke="#edf1f2"/>${marks}${months.map((m, i) => `<text x="${70 + i * (440 / groups)}" y="165" fill="#a0acb8" font-size="10">${m}</text>`).join("")}</svg><div class="preview-legend">${view.series.map((f, j) => `<span><i style="background:${["#a2cbbb", "#becfdc", "#c6d8cc"][j % 3]}"></i>${escape(fieldLabel(f))}</span>`).join("")}</div>`;
            }
            return `<article class="report-preview-component"><header><h4>${escape(viewTitle(view))}</h4><span class="component-link">Lineage ${icon("arrow", 12)}</span></header>${body}<button type="button" class="component-hit-area" data-report-view="${index}" aria-label="View lineage for ${escape(viewTitle(view))}"></button></article>`;
          })
          .join("");
        return `<div class="report-preview"><div class="report-preview-heading"><div><h3>${escape(d.title)}</h3><p>${escape(periodOptions[period][0])} · ${escape(d.parameters.currency.default)}</p></div><button class="btn text small" data-open-tab="layout">Edit layout</button></div><div class="preview-components">${components}</div><p class="preview-note">Layout preview · select a component to inspect its lineage.</p></div>`;
      }
      function feedbackModalMarkup() {
        return `<dialog class="feedback-modal" id="definition-inspector" aria-labelledby="inspector-title"><header class="drawer-header"><div><h3 id="inspector-title">Request changes</h3><p>Tell the agent what needs to change.</p></div><button class="drawer-close" data-action="close-inspector" aria-label="Close feedback">×</button></header><form id="feedback-form" novalidate><div class="modal-body"><label class="label" for="feedback-text">Feedback</label><textarea id="feedback-text" maxlength="1500" required aria-invalid="${Boolean(state.error)}" ${state.error ? 'aria-describedby="feedback-error"' : ""} placeholder="e.g. Show inflows and outflows separately, and use a line chart.">${escape(state.feedbackText)}</textarea>${state.error ? `<p class="field-error" id="feedback-error" role="alert">${escape(state.error)}</p>` : ""}</div><footer class="modal-actions">${button("close-inspector", "Cancel")}<button type="submit" class="btn primary">Send feedback</button></footer></form></dialog>`;
      }
      function inspectorMarkup() {
        if (state.step !== 3 || !state.inspector) return "";
        const type = state.inspector;
        if (type === "feedback") return feedbackModalMarkup();
        const selected =
          state.definition.views[
            Math.min(state.lineageViewIndex, state.definition.views.length - 1)
          ];
        let title = "",
          content = "";
        if (type === "sql") {
          title = "Query · monthly_cash_flow";
          content =
            editable("sql", "SQL", { code: true, sql: true }) +
            `<details class="drawer-section"><summary>Output fields</summary>${editable("outputs", "Output names", { code: true })}</details><details class="drawer-section"><summary>Transformations</summary>${editable("transforms", "Transformations · one per line")}</details><details class="drawer-section"><summary>Parameters</summary>${editable("parameters", "Parameter types and defaults", { code: true })}</details><details class="drawer-section"><summary>Sources</summary>${editable("sources", "Tables and columns", { code: true })}</details>`;
        }
        if (type === "sources") {
          title = "Source tables";
          content = editable("sources", "Tables and columns", { code: true });
        }
        if (type === "layout") {
          title = "Report layout";
          content = editable("layout", "Chart and table configuration", {
            code: true,
          });
        }
        return `<dialog class="editor-drawer" id="definition-inspector" aria-labelledby="inspector-title"><header class="drawer-header"><div><h3 id="inspector-title">${title}</h3><p>${type === "sql" ? `Selected component: ${escape(viewTitle(selected))}` : "Report definition · revision " + state.revision}</p></div><button class="drawer-close" data-action="close-inspector" aria-label="Close editor">×</button></header><div class="drawer-body">${content}${errorMarkup()}</div><footer class="drawer-footer">${button("close-inspector", "Close")}${button("save-edits", "Save new revision", "primary", "", !state.dirty)}</footer></dialog>`;
      }
      function activateInspector() {
        const dialog = $("#definition-inspector");
        if (!dialog) return;
        const returnFocus =
          state.inspector === "feedback"
            ? '[data-action="request-changes"]'
            : `#tab-${state.tab}`;
        dialog.addEventListener(
          "close",
          () => {

                : [v.x, ...(Array.isArray(v.series) ? v.series : [])];
            if (
              (v.type !== "table" &&
                (!Array.isArray(v.series) || !v.series.length)) ||
              !Array.isArray(fields) ||
              !fields.length ||
              fields.some((f) => !d.outputFields.includes(f))
            )
              throw new Error(
                "Layout bindings must reference declared output fields.",
              );
          }
          addRevision(d, "Engineer", "Edited the report definition.");
          state.inspector = null;
          state.error = "";
          state.flash = `Revision ${state.revision} saved. Awaiting approval.`;
          render();
        } catch (error) {
          state.error = error.message;
          render();
        }
      }
      function requestChanges() {
        if (state.status !== "pending" || state.dirty) return;
        const feedback = state.feedbackText.trim();
        if (!feedback) {
          state.error = "Add feedback for the agent.";
          render();
          $("#feedback-text").focus();
          return;
        }
        currentEntry().status = "rejected";
        currentEntry().feedback = feedback;
        state.status = "rejected";
        state.approved = null;
        state.approvedRevision = null;
        state.run = null;
        state.furthest = 3;
        state.error = "";
        state.inspector = null;
        render();
      }
      function revise() {
        if (state.status !== "rejected" || state.dirty) return;
        const d = clone(state.definition),
          text = currentEntry().feedback,
          lower = text.toLowerCase();
        const before = JSON.stringify(d),
          oldSplit = d.outputFields.includes("inflows");
        let split = oldSplit,
          needsSQL = false,
          manualSQL = false;
        if (/only net|just.*net|remove.*inflow/.test(lower)) {
          split = false;
          needsSQL = true;
        } else if (/inflow|outflow|separat|money.*(?:in|out)/.test(lower)) {
          split = true;
          needsSQL = true;
        }
        if (needsSQL && split !== oldSplit) {
          const normalized = (s) => s.replace(/\s+/g, "").toLowerCase();
          if (normalized(d.query.sql) === normalized(queryFor(oldSplit))) {
            d.query.sql = queryFor(split);
            d.outputFields = [
              "month",
              ...(split ? ["inflows", "outflows"] : []),
              "net_cash_flow",
            ];
            d.views.forEach((v) => {
              if (v.type === "table") v.columns = d.outputFields.slice();
              else v.series = d.outputFields.filter((f) => f !== "month");
            });
            d.transformations = d.transformations.filter(
              (t) => !/sum positive amounts as inflows/.test(t),
            );
            if (split)
              d.transformations.push(
                "Sum positive amounts as inflows and absolute negative amounts as outflows.",
              );
          } else manualSQL = true;
        }
        const chart = d.views.find(
          (v) => v.type === "bar" || v.type === "line",
        );
        if (chart && /line chart/.test(lower)) chart.type = "line";
        else if (chart && /bar chart/.test(lower)) chart.type = "bar";
        if (/remove.*table|without.*table|chart only/.test(lower))
          d.views = d.views.filter((v) => v.type !== "table");
        else if (
          /add.*table|include.*table/.test(lower) &&
          !d.views.some((v) => v.type === "table")
        )
          d.views.push({ type: "table", columns: d.outputFields.slice() });
        const title = text.match(
          /(?:title|call it|name it)\s*(?:to|:)?\s*["“]([^"”]+)["”]/i,
        );
        if (title) d.title = title[1];
        const changed = JSON.stringify(d) !== before;
        addRevision(d, "Agent", text);
        state.feedbackText = "";
        state.error = "";
        state.flash = manualSQL
          ? "Feedback preserved. Adjust the custom SQL before approving."
          : changed
            ? `Revision ${state.revision} updated from your feedback.`
            : "Feedback attached to the new draft. Edit the sections to complete the change.";
        go(3);
      }
      function approve() {
        if (state.status !== "pending" || state.dirty) return;
        state.status = "approved";
        currentEntry().status = "approved";
        state.approved = clone(state.definition);
        state.approvedRevision = state.revision;
        state.furthest = Math.max(state.furthest, 4);
        state.flash = `Revision ${state.revision} approved.`;
        render();
      }
      function openReport() {
        if (!state.approved || state.status !== "approved") return;
        state.period =
          Object.keys(periodOptions).find(
            (k) =>
              periodOptions[k][1] ===
                state.approved.parameters.start_date.default &&
              periodOptions[k][2] ===
                state.approved.parameters.end_date.default,
          ) || state.requestPeriod;
        state.currency = state.approved.parameters.currency.default;
        executeSimulation();
      }
      function executeSimulation() {
        if (!state.approved || state.status !== "approved") return;
        state.runCount++;
        const d = state.approved,
          normalize = (s) => s.replace(/\s+/g, "").toLowerCase();
        const split = d.outputFields.includes("inflows");
        const knownFields = [
          "month",
          ...(split ? ["inflows", "outflows"] : []),
          "net_cash_flow",
        ];
        const compatible =
          d.outputFields.length === knownFields.length &&
          knownFields.every((f) => d.outputFields.includes(f)) &&
          d.views.every(
            (v) =>
              v.type === "table" ||
              (v.x === "month" &&
                v.series.every((f) =>
                  ["inflows", "outflows", "net_cash_flow"].includes(f),
                )),
          ) &&
          d.sources.some(
            (s) =>
              s.table === "public.transactions" &&
              ["txn_date", "amount", "currency"].every((c) =>
                s.columns.includes(c),
              ),
          ) &&
          normalize(d.query.sql) === normalize(queryFor(split)) &&
          ["USD", "CAD"].includes(state.currency) &&
          Object.values(periodOptions).some(
            (p) =>
              p[1] === d.parameters.start_date.default &&
              p[2] === d.parameters.end_date.default,
          );
        if (!compatible) {
          state.run = {
            error:
              "This edited definition has no matching sample preview. Its saved instructions are preserved.",
            revision: state.approvedRevision,
          };
          go(5, true);
          return;
        }
        const months = {
            q3: ["07", "08", "09"],
            "jul-aug": ["07", "08"],
            sep: ["09"],
          }[state.period],
          names = { "07": "Jul", "08": "Aug", "09": "Sep" };
        const rows = months.map((m) => ({
          month: names[m],
          inflows: 0,
          outflows: 0,
          net: 0,
        }));
        sourceTransactions()
          .filter(
            (t) => t[1] === state.currency && months.includes(t[0].slice(5, 7)),
          )
          .forEach((t) => {
            const row = rows[months.indexOf(t[0].slice(5, 7))];
            if (t[2] > 0) row.inflows += t[2];
            else row.outflows -= t[2];
            row.net += t[2];
          });
        state.run = {
          id: `demo-run-${state.runCount}`,
          revision: state.approvedRevision,
          rows,
          currency: state.currency,
          period: state.period,
          sourceVersion: state.updates + 1,
        };
        state.sourceChanged = false;
        go(5, true);
      }
      function handleAction(action) {
        state.flash = "";
        state.error = "";
        if (action === "reset") {
          state = initialState();
          render();
          $("#stage-title").focus();
          return;
        }
        if (action === "home") {
          go(0);
          return;
        }
        if (action === "back") {
          go(Math.max(0, state.step - 1));
          return;
        }
        if (action === "submit-request") {
          submitRequest();
          return;
        }
        if (action === "confirm-request") {
          confirmRequest();
          return;
        }
        if (action === "engineer-view") {
          go(3, true);
          return;
        }
        if (action === "save-edits") {
          saveEdits();
          return;
        }
        if (action === "open-sql") {
          state.inspector = "sql";
          render();
          return;
        }
        if (action === "close-inspector") {
          const dialog = $("#definition-inspector");
          state.inspector = null;
          if (dialog?.open) dialog.close();
          return;
        }
        if (action === "discard-edits") {
          syncBuffers();
          render();
          return;
        }
        if (action === "request-changes") {
          if (state.status === "pending" && !state.dirty) {
            state.inspector = "feedback";
            render();
          }
          return;
        }
        if (action === "revise") {
          revise();
          return;
        }
        if (action === "approve") {
          approve();
          return;
        }
        if (action === "show-saved") {
          if (state.approved) go(4, true);
          return;
        }
        if (action === "open-report") {
          openReport();
          return;
        }
        if (action === "refresh-run") {
          executeSimulation();
          return;
        }
        if (action === "update-source") {
          state.updates++;
          state.sourceChanged = true;
          render();
          return;
        }
      }
      document.addEventListener("click", (event) => {
        const trace = event.target.closest("[data-lineage-field]");
        if (trace) {
          state.lineageField = trace.dataset.lineageField;
          render();
          return;
        }
        const component = event.target.closest("[data-report-view]");
        if (component) {
          state.lineageViewIndex = Number(component.dataset.reportView);
          state.lineageField = "all";
          state.tab = `view-${state.lineageViewIndex}`;
          render();
          $(`#tab-${state.tab}`).focus();
          return;
        }
        const open = event.target.closest("[data-open-tab]");
        if (open) {
          state.inspector = open.dataset.openTab;
          render();
          return;
        }
        const action = event.target.closest("[data-action]");
        if (action && !action.disabled) {
          event.preventDefault();
          handleAction(action.dataset.action);
          return;
        }
        const step = event.target.closest("[data-step]");
        if (step && !step.disabled) {
          state.flash = "";
          go(Number(step.dataset.step));
          return;
        }
        const tab = event.target.closest("[data-tab]");
        if (tab) {
          state.tab = tab.dataset.tab;
          render();
          $(`#tab-${state.tab}`).focus();
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.dataset.definitionField) {
          state.buffers[event.target.dataset.definitionField] =
            event.target.value;
          state.error = "";
          updateDirty();
        }
        if (event.target.id === "feedback-text") {
          state.feedbackText = event.target.value;
          if (state.error && event.target.value.trim()) {
            state.error = "";
            event.target.setAttribute("aria-invalid", "false");
            event.target.removeAttribute("aria-describedby");
            $("#feedback-error")?.remove();
          }
        }
        if (event.target.id === "clarification-text")
          state.clarification = event.target.value;
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "lineage-related") {
          state.lineageRelated = event.target.checked;
          render();
          return;
        }
        if (event.target.id === "period") {
          state.period = event.target.value;
          executeSimulation();
        }
        if (event.target.id === "currency") {
          state.currency = event.target.value;
          executeSimulation();
        }
      });
      document.addEventListener("submit", (event) => {
        event.preventDefault();
        if (event.target.id === "request-form") submitRequest();
        if (event.target.id === "clarify-form") confirmRequest();
        if (event.target.id === "feedback-form") requestChanges();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.inspector) {
          event.preventDefault();
          handleAction("close-inspector");
          return;
        }
        if (
          !event.target.matches(".report-navigation [role=tab]") ||
          !["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)
        )
          return;
        event.preventDefault();
        const tabs = [
            ...document.querySelectorAll(".report-navigation [role=tab]"),
          ],
          index = tabs.indexOf(event.target);
        const next =
          event.key === "Home"
            ? 0
            : event.key === "End"
              ? tabs.length - 1
              : (index + (event.key === "ArrowRight" ? 1 : tabs.length - 1)) %
                tabs.length;
        state.tab = tabs[next].dataset.tab;
        render();
        $(`#tab-${state.tab}`).focus();
      });
      const baseTransactions = [
        ["2026-07-06", "USD", 6200000],
        ["2026-07-12", "USD", -2750000],
        ["2026-07-28", "USD", -1320000],
        ["2026-08-04", "USD", 5800000],
        ["2026-08-14", "USD", -3100000],
        ["2026-08-29", "USD", -1410000],
        ["2026-09-07", "USD", 6425000],
        ["2026-09-16", "USD", -3200000],
        ["2026-09-27", "USD", -1507000],
        ["2026-07-08", "CAD", 3900000],
        ["2026-07-21", "CAD", -2610000],
        ["2026-08-09", "CAD", 4200000],
        ["2026-08-23", "CAD", -2880000],
        ["2026-09-10", "CAD", 4550000],
        ["2026-09-22", "CAD", -3010000],
      ];
      function sourceTransactions() {
        const rows = baseTransactions.map((r) => r.slice());
        for (let i = 0; i < state.updates; i++)
          rows.push(
            ["2026-09-29", "USD", 275000],
            ["2026-09-29", "CAD", 190000],
          );
        return rows;
      }
      const money = (cents, currency) =>
        new Intl.NumberFormat("en-US", {
          style: "currency",
          currency,
          maximumFractionDigits: 0,
        }).format(cents / 100);
      function chartMarkup(run) {
        const split = state.approved.outputFields.includes("inflows");
        const view = state.approved.views.find(
          (v) => v.type === "line" || v.type === "bar",
        );
        const isLine = view.type === "line";
        const bindings = {
          inflows: ["inflows", "Inflows", "#078b81"],
          outflows: ["outflows", "Outflows", "#7ea4bf"],
          net_cash_flow: [
            "net",
            "Net cash flow",
            split ? "#92bca1" : "#078b81",
          ],
        };
        const series = view.series.map((field) => bindings[field]);
        const max =
          Math.max(
            1,
            ...run.rows.flatMap((row) => series.map((s) => row[s[0]])),
          ) * 1.2;
        const width = 600,
          height = 225,
          left = 54,
          right = 18,
          top = 16,
          bottom = 35,
          plotW = width - left - right,
          plotH = height - top - bottom;
        const y = (v) => top + plotH - (v / max) * plotH;
        let svg = "";
        for (let i = 0; i < 4; i++) {
          const v = (max * i) / 3;
          svg += `<line x1="${left}" y1="${y(v)}" x2="${width - right}" y2="${y(v)}" stroke="#edf0f3"/><text x="${left - 10}" y="${y(v) + 4}" text-anchor="end" fill="#98a2b3" font-size="10">${Math.round(v / 100000)}k</text>`;
        }
        const group = plotW / run.rows.length;
        run.rows.forEach((row, i) => {
          svg += `<text x="${left + group * (i + 0.5)}" y="${height - 12}" text-anchor="middle" fill="#8590a0" font-size="10">${row.month}</text>`;
        });
        series.forEach((s, si) => {
          if (isLine) {
            const points = run.rows
              .map((r, i) => `${left + group * (i + 0.5)},${y(r[s[0]])}`)
              .join(" ");
            svg += `<polyline fill="none" stroke="${s[2]}" stroke-width="2.5" points="${points}"/>`;
            run.rows.forEach((row, i) => {
              svg += `<circle cx="${left + group * (i + 0.5)}" cy="${y(row[s[0]])}" r="4" fill="${s[2]}"><title>${row.month} ${s[1]}: ${money(row[s[0]], run.currency)}</title></circle>`;
            });
          } else {
            const barW = Math.min(45, (group * 0.65) / series.length);
            run.rows.forEach((row, i) => {
              const x =
                left +
                group * (i + 0.5) -
                (barW * series.length) / 2 +
                si * barW;
              svg += `<rect x="${x}" y="${y(row[s[0]])}" width="${barW - 4}" height="${Math.max(0, plotH - (y(row[s[0]]) - top))}" rx="3" fill="${s[2]}"><title>${row.month} ${s[1]}: ${money(row[s[0]], run.currency)}</title></rect>`;
            });
          }
        });
        const accessible = run.rows
          .map(
            (r) =>
              `${r.month}: ${series.map((s) => `${s[1]} ${money(r[s[0]], run.currency)}`).join(", ")}`,
          )
          .join("; ");
        return `<div class="report-chart"><h4>Monthly cash flow <span class="caption">(${run.currency})</span></h4><svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escape(accessible)}"><title>Simulated monthly cash-flow results</title>${svg}</svg><div class="legend">${series.map((s) => `<span><i style="background:${s[2]}"></i>${s[1]}</span>`).join("")}</div></div>`;
      }

      render();
    </script>
  </body>
</html>
